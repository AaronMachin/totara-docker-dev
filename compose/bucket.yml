services:

  bucket:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BUCKET_USER:-admin}
      MINIO_ROOT_PASSWORD: ${BUCKET_SECRET:-admin12345}
    ports:
      - "8000:9000"
      - "8001:9001"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
